name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode_15.4.app || sudo xcode-select -switch /Applications/Xcode.app

      - name: Build Archive
        run: |
          xcodebuild -project ZiraatMobil.xcodeproj \
            -scheme ZiraatMobil \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZiraatMobil.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/ZiraatMobil.xcarchive/Products/Applications/ZiraatMobil.app Payload/
          zip -r ZiraatMobil.ipa Payload
          ls -lh ZiraatMobil.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZiraatMobil-IPA
          path: ZiraatMobil.ipa
          retention-days: 14
